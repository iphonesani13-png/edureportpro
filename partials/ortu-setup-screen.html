<div id="ortu-setup-screen"
        class="min-h-screen flex items-center justify-center p-4 bg-gray-50 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-purple-50 via-gray-50 to-white hidden">
        <div class="w-full max-w-md p-8 glass-card text-center">
            <div class="text-6xl mb-4">👨‍👩‍👧</div>
            <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Tautkan Data Anak</h2>
            <p class="text-gray-500 text-sm mb-6 font-medium">Masukkan ID Akses atau NIS anak Anda untuk melihat raport
                dan mutasi karakter.</p>
            <input type="text" id="ortu-input-nis" placeholder="Ketik NIS (Cth: 2026001)"
                class="w-full p-4 bg-white text-gray-900 font-mono tracking-widest text-lg text-center shadow-inner mb-2 border-2 border-purple-100 rounded-xl">
            <p id="ortu-setup-error" class="text-red-500 text-xs font-bold mb-4 hidden bg-red-50 p-2 rounded-lg"></p>
            <button onclick="verifyAndLinkStudent()"
                class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl hover:bg-purple-700 transition-all shadow-lg shadow-purple-200 mt-2">Cek
                & Tautkan Data</button>
            <button onclick="logout()" class="text-xs text-gray-400 mt-6 font-bold hover:text-gray-600">Batal &
                Keluar</button>
        </div>
    </div>
