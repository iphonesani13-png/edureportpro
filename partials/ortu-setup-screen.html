<section id="ortu-setup-screen" class="hidden min-h-screen flex items-center justify-center p-6 bg-slate-50 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-full opacity-[0.03] pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>

    <div class="max-w-md w-full space-y-8 relative z-10">
        <div class="text-center">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-indigo-200 mx-auto mb-6">
                LT
            </div>
            <h2 class="text-3xl font-black text-slate-900 tracking-tight">Aktivasi Dashboard</h2>
            <p class="text-slate-500 font-medium mt-2">Selamat datang, Bunda! Silakan masukkan NIS (Nomor Induk Siswa) Ananda untuk melanjutkan.</p>
        </div>

        <div class="glass-card p-8 md:p-10 border border-white shadow-xl shadow-slate-200/50">
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Nomor Induk Siswa (NIS)</label>
                    <input type="text" id="ortu-input-nis" placeholder="Contoh: 12345" class="w-full p-4 bg-slate-100 border-none rounded-2xl font-black text-slate-800 text-lg focus:ring-2 focus:ring-indigo-500 text-center tracking-widest">
                </div>
                
                <button onclick="verifyAndLinkStudent()" class="btn-premium w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg active:scale-95 transition-all">
                    Hubungkan Data 🚀
                </button>

                <div id="ortu-setup-error" class="hidden p-4 bg-rose-50 text-rose-600 rounded-2xl text-xs font-bold text-center"></div>
            </div>
        </div>

        <button onclick="logout()" class="w-full text-slate-400 font-bold text-xs hover:text-indigo-600 transition-colors">
            ← Kembali ke halaman utama
        </button>
    </div>
</section>
