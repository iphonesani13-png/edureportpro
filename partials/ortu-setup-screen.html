<section id="ortu-setup-screen" class="hidden min-h-screen flex items-center justify-center p-6 bg-[#f8fafc] relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-full opacity-[0.03] pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>

    <div class="max-w-md w-full space-y-10 relative z-10">
        <div class="text-center">
            <div class="w-16 h-16 bg-violet-600 rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-violet-200 mx-auto mb-6">
                LT
            </div>
            <h2 class="text-3xl font-black text-slate-900 tracking-tight">Aktivasi Portal Wali</h2>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-2">Selamat datang, Ayah & Bunda</p>
        </div>

        <div class="glass-card p-10 md:p-12 bg-white text-center">
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 block">Kode Aktivasi Wali</label>
                    <input type="text" id="ortu-input-invite-code" placeholder="Masukkan kode unik..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-center text-sm font-bold tracking-widest focus:ring-2 focus:ring-violet-500 transition-all uppercase placeholder:normal-case placeholder:tracking-normal">
                </div>
                <p class="text-[10px] text-slate-500 font-medium leading-relaxed">
                    Dapatkan Kode Aktivasi dari Wali Kelas atau Admin Sekolah untuk menghubungkan akun Anda dengan data nilai ananda.
                </p>
                
                <div id="ortu-setup-error" class="hidden p-4 bg-rose-50 text-rose-600 rounded-2xl text-[10px] font-black uppercase text-center"></div>

                <button onclick="window.verifyAndLinkStudent()" class="w-full py-4 bg-violet-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-violet-700 transition-all shadow-lg shadow-violet-200">
                    Hubungkan Akun
                </button>
            </div>
        </div>

        <button onclick="logout()" class="w-full text-slate-400 font-bold text-[10px] uppercase tracking-widest hover:text-violet-600 transition-colors">
            ← Kembali ke halaman login
        </button>
    </div>
</section>
