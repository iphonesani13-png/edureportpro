<div id="main-app" class="hidden min-h-screen flex flex-col md:flex-row bg-[#f8fafc]">
    <!-- MINIMALIST SIDEBAR -->
    <aside id="sidebar" class="w-full md:w-64 bg-white border-r border-slate-100 flex flex-col sticky top-0 h-screen z-50 transition-all duration-300">
        <div class="p-8 flex items-center gap-3">
            <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-sm">LT</div>
            <div>
                <h2 class="text-xs font-bold text-slate-900 tracking-tight leading-tight uppercase">Laa Tahzan</h2>
                <p id="user-role-badge" class="text-[9px] font-medium text-slate-400 uppercase tracking-widest mt-0.5">Guru / Admin</p>
            </div>
        </div>

        <nav class="p-4 space-y-1 flex-grow overflow-y-auto">
            <div id="nav-guru" class="space-y-1">
                <button id="btn-dashboard" onclick="switchTab('dashboard')" class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold transition-all">
                    <span>📊</span> Daftar Kelas
                </button>
                <button id="btn-leaderboard" onclick="switchTab('leaderboard')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold transition-all">
                    <span>🏆</span> Peringkat
                </button>
                <button id="btn-tugas" onclick="switchTab('tugas')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold transition-all">
                    <span>📝</span> Tugas Siswa
                </button>
                <button id="btn-editor" onclick="switchTab('editor')" class="sidebar-item hidden w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold transition-all">
                    <span>👤</span> Profil Siswa
                </button>
            </div>

            <div id="nav-ortu" class="hidden space-y-1">
                <button id="btn-viewer" onclick="switchTab('viewer')" class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold transition-all">
                    <span>🏠</span> Dashboard
                </button>
            </div>
        </nav>

        <div class="p-4 border-t border-slate-50">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-rose-500 transition-all">
                <span>🚪</span> Keluar
            </button>
        </div>
    </aside>

    <!-- CLEAN CONTENT AREA -->
    <main class="flex-grow overflow-x-hidden">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 px-8 py-4 flex items-center justify-between">
            <h1 class="text-lg font-bold text-slate-900 tracking-tight italic">SMPIT <span class="text-indigo-600">Tracker</span></h1>
            
            <div class="flex items-center gap-4">
                <select id="filter-tahun" class="bg-slate-50 border-none text-[10px] font-bold text-slate-500 rounded-full px-4 py-2 focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                    <option value="2025/2026">2025/2026</option>
                    <option value="2026/2027">2026/2027</option>
                </select>
                <div class="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-sm shadow-sm">👤</div>
            </div>
        </header>

        <div class="p-6 md:p-8 max-w-7xl mx-auto space-y-8">
            
            <!-- DASHBOARD SECTION -->
            <section id="dashboard-section" class="hidden animate-fade-in space-y-6">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Manajemen Kelas</h2>
                        <p class="text-slate-400 text-sm font-medium mt-0.5">Pantau perkembangan akademik dan karakter siswa.</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                        <div class="relative flex-grow md:flex-grow-0">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xs">🔍</span>
                            <input id="filter-siswa-query" type="text" oninput="renderDashboard()" placeholder="Cari NIS / Nama..." class="w-full md:w-64 pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <select id="filter-kelas" onchange="renderDashboard()" class="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold appearance-none cursor-pointer focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="ALL">Semua Kelas</option>
                            <option value="7A">Kelas 7A</option><option value="7B">Kelas 7B</option>
                            <option value="8">Kelas 8</option><option value="9">Kelas 9</option>
                        </select>
                        <button onclick="document.getElementById('csv-input').click()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 transition-all shadow-md">
                            Impor Data CSV
                        </button>
                        <input type="file" id="csv-input" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
                    </div>
                </div>

                <!-- MINIMALIST STATS -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                    <div class="glass-card p-6 bg-white">
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Siswa</p>
                        <p id="dashboard-total-active" class="text-2xl font-bold text-slate-900">0</p>
                    </div>
                    <div class="glass-card p-6 bg-white">
                        <p class="text-[9px] font-bold text-emerald-500 uppercase tracking-widest mb-1">Poin Positif</p>
                        <p id="dashboard-positive-count" class="text-2xl font-bold text-slate-900">0</p>
                    </div>
                    <div class="glass-card p-6 bg-white text-slate-400">
                        <p class="text-[9px] font-bold uppercase tracking-widest mb-1">Siswa Netral</p>
                        <p id="dashboard-neutral-count" class="text-2xl font-bold text-slate-900">0</p>
                    </div>
                    <div class="glass-card p-6 bg-white">
                        <p class="text-[9px] font-bold text-rose-500 uppercase tracking-widest mb-1">Butuh Perhatian</p>
                        <p id="dashboard-negative-count" class="text-2xl font-bold text-slate-900">0</p>
                    </div>
                </div>

                <!-- CLEAN TABLE -->
                <div class="glass-card overflow-hidden bg-white shadow-sm border border-slate-100">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap modern-table">
                            <thead>
                                <tr>
                                    <th class="text-center w-16">No</th>
                                    <th>Identitas (NIS)</th>
                                    <th>Nama Lengkap</th>
                                    <th class="text-center">Kelas</th>
                                    <th class="text-center">Poin</th>
                                    <th class="text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="student-table-body" class="divide-y divide-slate-50 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Other sections remain but with simplified styling... -->
            <section id="viewer-section" class="hidden animate-fade-in space-y-8">
                <div id="ortu-content-box" class="space-y-6">
                    <div class="glass-card p-8 bg-indigo-600 text-white border-none shadow-xl">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                            <div class="text-center md:text-left">
                                <span class="text-[9px] font-bold bg-white/20 px-3 py-1 rounded-full uppercase tracking-widest mb-3 inline-block">Raport Digital Siswa</span>
                                <h1 id="view-ortu-nama" class="text-3xl font-bold tracking-tight mb-1">Memuat...</h1>
                                <p class="text-indigo-100 text-sm font-medium">Kelas <span id="view-ortu-kelas"></span> • NIS <span id="view-ortu-id"></span></p>
                            </div>
                            <div class="bg-white/10 p-6 rounded-2xl border border-white/10 text-center min-w-[140px]">
                                <p class="text-[9px] font-bold uppercase tracking-widest text-indigo-100 mb-1">Poin Karakter</p>
                                <h2 id="ortu-poin" class="text-4xl font-bold">0</h2>
                            </div>
                        </div>
                    </div>
                    <!-- Stats and Table Ortu follow the same clean style... -->
                </div>
            </section>

        </div>
    </main>
</div>
