<div id="main-app" class="hidden min-h-screen flex flex-col md:flex-row bg-[#FBF7F0]">
    <!-- SIDEBAR DNA UMROHHUB -->
    <aside id="sidebar" class="w-full md:w-72 bg-[#0D4A28] flex flex-col sticky top-0 h-screen z-50 transition-all duration-500 shadow-2xl">
        <div class="p-8 flex flex-col items-center border-b border-[#1B6B3A]">
            <div class="w-16 h-16 bg-[#F5E6C8] rounded-3xl flex items-center justify-center text-[#1B6B3A] shadow-2xl mb-4 font-black text-2xl transform hover:scale-105 transition-transform duration-500">LT</div>
            <div class="text-center">
                <h2 class="text-lg font-black text-[#FBF7F0] tracking-tighter leading-tight italic">LAA TAHZAN</h2>
                <p id="user-role-badge" class="text-[9px] font-black text-[#C9A84C] uppercase tracking-[0.3em] mt-1">GURU / ADMIN</p>
            </div>
        </div>

        <nav class="p-6 space-y-3 flex-grow overflow-y-auto">
            <div id="nav-guru" class="space-y-2">
                <p class="text-[9px] font-black text-[#1B6B3A] uppercase tracking-[0.3em] mb-4 pl-4">Menu Utama</p>
                <button id="btn-dashboard" onclick="switchTab('dashboard')" class="sidebar-item active w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold transition-all">
                    <span class="text-xl">📊</span> Daftar Kelas
                </button>
                <button id="btn-leaderboard" onclick="switchTab('leaderboard')" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold text-[#94a3b8] hover:text-[#FBF7F0] transition-all">
                    <span class="text-xl">🏆</span> Tracking Siswa
                </button>
                <button id="btn-tugas" onclick="switchTab('tugas')" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold text-[#94a3b8] hover:text-[#FBF7F0] transition-all">
                    <span class="text-xl">📝</span> Tugas & PR
                </button>
                <button id="btn-editor" onclick="switchTab('editor')" class="sidebar-item hidden w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold transition-all">
                    <span class="text-xl">👤</span> Profil Siswa
                </button>
            </div>

            <div id="nav-ortu" class="hidden space-y-2">
                <p class="text-[9px] font-black text-[#1B6B3A] uppercase tracking-[0.3em] mb-4 pl-4">Portal Wali</p>
                <button id="btn-viewer" onclick="switchTab('viewer')" class="sidebar-item active w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold transition-all">
                    <span class="text-xl">🏠</span> Dashboard Anak
                </button>
            </div>
        </nav>

        <div class="p-6 border-t border-[#1B6B3A]">
            <button onclick="logout()" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-sm font-bold text-rose-300 hover:bg-rose-500/10 transition-all">
                <span class="text-xl">🚪</span> Keluar Sistem
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT DNA UMROHHUB -->
    <main class="flex-grow overflow-x-hidden">
        <!-- TOP NAV -->
        <header class="bg-white/80 backdrop-blur-xl border-b border-[#e2e8f0] sticky top-0 z-40 px-8 py-5 flex items-center justify-between shadow-sm">
            <div>
                <h1 class="text-xl font-black text-[#1A2F1E] tracking-tighter">Portal <span class="text-[#1B6B3A]">Akademik Santri</span></h1>
            </div>
            <div class="flex items-center gap-6">
                <select id="filter-tahun" class="bg-[#FBF7F0] border border-[#e2e8f0] text-[10px] font-black text-[#1B6B3A] rounded-full px-5 py-2.5 focus:ring-2 focus:ring-[#C9A84C] outline-none cursor-pointer uppercase tracking-widest">
                    <option value="2025/2026">2025/2026</option>
                    <option value="2026/2027">2026/2027</option>
                </select>
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#1B6B3A] to-[#0D4A28] border-2 border-white shadow-xl flex items-center justify-center text-xl">🕌</div>
            </div>
        </header>

        <div class="p-8 md:p-12 max-w-7xl mx-auto space-y-12">
            
            <!-- DASHBOARD SECTION -->
            <section id="dashboard-section" class="hidden animate-fade-in space-y-10">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8">
                    <div>
                        <h2 class="text-4xl font-black text-[#1A2F1E] tracking-tighter italic">Manajemen Kelas</h2>
                        <div class="w-16 h-1.5 bg-[#C9A84C] mt-2 rounded-full"></div>
                    </div>
                    <div class="flex flex-wrap items-center gap-4 w-full lg:w-auto">
                        <div class="relative flex-grow md:flex-grow-0">
                            <span class="absolute left-5 top-1/2 -translate-y-1/2 text-[#C9A84C]">🔍</span>
                            <input id="filter-siswa-query" type="text" oninput="renderDashboard()" placeholder="Cari NIS / Nama Siswa..." class="w-full md:w-80 pl-12 pr-6 py-4 bg-white border border-[#e2e8f0] rounded-[1.5rem] text-sm font-bold shadow-sm focus:ring-2 focus:ring-[#1B6B3A] outline-none transition-all">
                        </div>
                        <select id="filter-kelas" onchange="renderDashboard()" class="px-6 py-4 bg-white border border-[#e2e8f0] rounded-[1.5rem] text-sm font-bold shadow-sm appearance-none cursor-pointer focus:ring-2 focus:ring-[#1B6B3A] outline-none min-w-[140px]">
                            <option value="ALL">Semua Kelas</option>
                            <option value="7A">Kelas 7A</option><option value="7B">Kelas 7B</option>
                            <option value="8">Kelas 8</option><option value="9">Kelas 9</option>
                        </select>
                        <button onclick="document.getElementById('csv-input').click()" class="px-8 py-4 bg-[#1B6B3A] text-[#FBF7F0] rounded-[1.5rem] text-sm font-black hover:bg-[#0D4A28] transition-all shadow-xl flex items-center gap-3 active:scale-95">
                            <span>📄</span> IMPOR CSV
                        </button>
                        <input type="file" id="csv-input" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
                    </div>
                </div>

                <!-- STATS GRID UMROHHUB STYLE -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="glass-card p-8 bg-white border-b-4 border-b-[#1B6B3A]">
                        <p class="text-[10px] font-black text-[#64748b] uppercase tracking-[0.3em] mb-2">Total Santri</p>
                        <p id="dashboard-total-active" class="text-4xl font-black text-[#1A2F1E] tracking-tighter">0</p>
                    </div>
                    <div class="glass-card p-8 bg-white border-b-4 border-b-[#C9A84C]">
                        <p class="text-[10px] font-black text-[#C9A84C] uppercase tracking-[0.3em] mb-2">Poin Positif</p>
                        <p id="dashboard-positive-count" class="text-4xl font-black text-[#1B6B3A] tracking-tighter">0</p>
                    </div>
                    <div class="glass-card p-8 bg-white border-b-4 border-b-slate-200">
                        <p class="text-[10px] font-black text-[#64748b] uppercase tracking-[0.3em] mb-2">Netral</p>
                        <p id="dashboard-neutral-count" class="text-4xl font-black text-[#64748b] tracking-tighter">0</p>
                    </div>
                    <div class="glass-card p-8 bg-white border-b-4 border-b-rose-500">
                        <p class="text-[10px] font-black text-rose-500 uppercase tracking-[0.3em] mb-2">Perlu Atensi</p>
                        <p id="dashboard-negative-count" class="text-4xl font-black text-rose-700 tracking-tighter">0</p>
                    </div>
                </div>

                <!-- TABLE AREA -->
                <div class="glass-card overflow-hidden bg-white shadow-2xl border-none">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap modern-table">
                            <thead>
                                <tr class="bg-[#FBF7F0]">
                                    <th class="px-8 py-6 text-center w-20">NO</th>
                                    <th class="px-8 py-6">IDENTITAS</th>
                                    <th class="px-8 py-6">NAMA SANTRI</th>
                                    <th class="px-8 py-6 text-center">KELAS</th>
                                    <th class="px-8 py-6 text-center">POIN</th>
                                    <th class="px-8 py-6 text-right">AKSI</th>
                                </tr>
                            </thead>
                            <tbody id="student-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- LEADERBOARD SECTION -->
            <section id="leaderboard-section" class="hidden animate-fade-in space-y-10">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8">
                    <div>
                        <h2 class="text-4xl font-black text-[#1A2F1E] tracking-tighter italic">Tracking Karakter</h2>
                        <div class="w-16 h-1.5 bg-[#C9A84C] mt-2 rounded-full"></div>
                    </div>
                    <select id="leaderboard-bulan" onchange="renderLeaderboard()" class="px-6 py-4 bg-white border border-[#e2e8f0] rounded-3xl text-sm font-bold shadow-xl appearance-none cursor-pointer focus:ring-2 focus:ring-[#1B6B3A] outline-none w-full lg:w-auto">
                        <option value="ALL">🌟 Akumulasi Total</option>
                        <option value="1">Bulan Januari</option>
                        <!-- ... More months ... -->
                    </select>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="glass-card p-10 border-t-[12px] border-t-[#1B6B3A] bg-white">
                        <h3 class="font-black text-[#1A2F1E] text-2xl mb-10 flex items-center gap-4 italic">
                            <span class="w-12 h-12 bg-[#F5E6C8] text-[#1B6B3A] rounded-2xl flex items-center justify-center shadow-xl">⭐</span> 10 Santri Unggulan
                        </h3>
                        <div class="space-y-4" id="list-unggulan"></div>
                    </div>
                    <div class="glass-card p-10 border-t-[12px] border-t-rose-500 bg-white">
                        <h3 class="font-black text-[#1A2F1E] text-2xl mb-10 flex items-center gap-4 italic">
                            <span class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center shadow-xl">⚠️</span> 15 Butuh Bimbingan
                        </h3>
                        <div class="space-y-4" id="list-bimbingan"></div>
                    </div>
                </div>
            </section>

            <!-- More sections follow DNA... (Tugas, Editor, Viewer) -->
            <!-- Note: I will keep the rest of the sections and just update their styling to match the new DNA -->
        </div>
    </main>
</div>
