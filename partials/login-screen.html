<div id="login-screen"
        class="min-h-screen flex items-center justify-center p-4 bg-gray-50 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-purple-50 via-gray-50 to-white">
        <div class="w-full max-w-md p-8 glass-card">
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-purple-200 mb-4 text-white text-2xl font-black">
                    LT</div>
                <h1 class="text-2xl font-extrabold text-gray-900 mb-1">SMPIT LAA TAHZAN</h1>
                <p class="text-gray-500 text-sm font-medium">Portal Akademik & Karakter</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-8 bg-gray-100/50 p-2 rounded-2xl">
                <button onclick="setLoginRole('guru')" id="role-btn-guru"
                    class="py-3 px-2 bg-white rounded-xl shadow-sm text-purple-700 font-bold transition-all flex flex-col items-center gap-1 text-xs border border-gray-200 ring-2 ring-purple-500 ring-offset-2">
                    <span class="text-2xl">👨‍🏫</span> Guru
                </button>
                <button onclick="setLoginRole('orangtua')" id="role-btn-ortu"
                    class="py-3 px-2 rounded-xl text-gray-500 font-bold transition-all flex flex-col items-center gap-1 text-xs hover:bg-gray-100 border border-transparent">
                    <span class="text-2xl">👨‍👩‍👧</span> Orang Tua
                </button>
            </div>

            <form id="auth-form" class="space-y-4 text-left">
                <button type="button" onclick="handleGoogleLogin()"
                    class="w-full bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-all flex items-center justify-center gap-3 shadow-lg shadow-gray-200 mt-6">
                    <svg class="w-5 h-5 bg-white p-0.5 rounded-full" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Masuk dengan Google
                </button>
                <p id="login-error-msg"
                    class="text-red-500 text-[11px] font-bold text-center hidden mt-3 p-3 bg-red-50 rounded-lg"></p>
            </form>
        </div>
    </div>
