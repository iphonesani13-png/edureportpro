<section id="login-screen" class="hidden min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-indigo-900 via-purple-800 to-indigo-900 relative overflow-hidden">
    <!-- Decorative Orbs -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-500/20 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500/20 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s"></div>

    <div class="glass-card max-w-md w-full p-10 md:p-12 relative z-10 border border-white/10 shadow-2xl">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-white rounded-[2rem] flex items-center justify-center text-indigo-600 text-3xl font-black shadow-2xl mx-auto mb-6 transform -rotate-6 hover:rotate-0 transition-transform duration-500">
                LT
            </div>
            <h1 class="text-3xl font-black text-white tracking-tighter mb-2 italic">SMPIT Tracker</h1>
            <p class="text-indigo-200 text-sm font-medium">Sistem Informasi Kesiswaan Terpadu<br>Laa Tahzan Citra</p>
        </div>

        <div class="space-y-6">
            <p class="text-[10px] font-black text-indigo-300 uppercase tracking-[0.3em] text-center mb-4">Pilih Akses Masuk</p>
            
            <div class="grid grid-cols-2 gap-4">
                <button id="role-btn-guru" onclick="setLoginRole('guru')" class="sidebar-item active py-4 px-2 rounded-2xl flex flex-col items-center gap-2 border border-white/5 group transition-all">
                    <span class="text-2xl group-hover:scale-125 transition-transform">👨‍🏫</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Guru / Admin</span>
                </button>
                <button id="role-btn-ortu" onclick="setLoginRole('orangtua')" class="sidebar-item py-4 px-2 rounded-2xl flex flex-col items-center gap-2 border border-white/5 group transition-all text-indigo-200">
                    <span class="text-2xl group-hover:scale-125 transition-transform">👪</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Orang Tua</span>
                </button>
            </div>

            <button onclick="handleGoogleLogin()" class="w-full bg-white text-slate-900 font-black py-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-indigo-50 transition-all shadow-xl active:scale-95 group">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5 group-hover:rotate-12 transition-transform" alt="Google">
                <span>Masuk dengan Google</span>
            </button>

            <div id="login-error-msg" class="hidden p-4 bg-rose-500/20 border border-rose-500/30 rounded-2xl text-rose-200 text-xs font-bold text-center animate-shake"></div>
        </div>

        <div class="mt-12 text-center">
            <p class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest">&copy; 2026 SMPIT Laa Tahzan Citra</p>
        </div>
    </div>
</section>
