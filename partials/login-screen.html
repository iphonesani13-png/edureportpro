<section id="login-screen" class="hidden min-h-screen flex items-center justify-center p-6 bg-white relative overflow-hidden">
    <!-- Clean Abstract Background -->
    <div class="absolute top-0 left-0 w-full h-full bg-[#f8fafc] opacity-50"></div>
    <div class="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] bg-indigo-50 rounded-full blur-[120px]"></div>

    <div class="max-w-md w-full relative z-10">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-indigo-200 mx-auto mb-6">
                LT
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-2">Portal Kesiswaan</h1>
            <p class="text-slate-500 text-sm font-medium">SMPIT Laa Tahzan Citra</p>
        </div>

        <div class="glass-card p-8 md:p-10 bg-white shadow-xl shadow-slate-200/50 border-slate-100">
            <div class="space-y-8">
                <div class="space-y-4">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">Masuk sebagai</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="role-btn-guru" onclick="setLoginRole('guru')" class="sidebar-item active py-4 flex flex-col items-center gap-2 border border-slate-100 transition-all">
                            <span class="text-xl">👨‍🏫</span>
                            <span class="text-xs font-bold">GURU</span>
                        </button>
                        <button id="role-btn-ortu" onclick="setLoginRole('orangtua')" class="sidebar-item py-4 flex flex-col items-center gap-2 border border-slate-100 transition-all">
                            <span class="text-xl">👪</span>
                            <span class="text-xs font-bold text-slate-400">WALI</span>
                        </button>
                    </div>
                </div>

                <button onclick="handleGoogleLogin()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-black transition-all active:scale-95 shadow-lg shadow-slate-200">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5 bg-white p-0.5 rounded-full" alt="Google">
                    <span class="text-sm">Masuk dengan Google</span>
                </button>

                <div id="login-error-msg" class="hidden p-4 bg-rose-50 border border-rose-100 rounded-2xl text-rose-600 text-xs font-bold text-center"></div>
            </div>
        </div>

        <p class="mt-10 text-center text-[10px] font-bold text-slate-300 uppercase tracking-widest">&copy; 2026 SMPIT LAA TAHZAN CITRA</p>
    </div>
</section>
