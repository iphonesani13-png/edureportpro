<section id="login-screen" class="hidden min-h-screen flex items-center justify-center p-6 bg-[#FBF7F0] relative overflow-hidden">
    <!-- Decorative DNA UmrohHub (Arabesque Style) -->
    <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-[#1B6B3A]/5 rounded-full blur-[100px] animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#C9A84C]/5 rounded-full blur-[100px] animate-pulse" style="animation-delay: 2s"></div>

    <div class="glass-card max-w-md w-full p-10 md:p-12 relative z-10 border border-[#e2e8f0] shadow-2xl bg-white/80 backdrop-blur-xl">
        <div class="text-center mb-12">
            <div class="w-24 h-24 bg-[#1B6B3A] rounded-[2.5rem] flex items-center justify-center text-[#F5E6C8] text-4xl font-black shadow-2xl mx-auto mb-8 transform -rotate-6 hover:rotate-0 transition-transform duration-700">
                LT
            </div>
            <h1 class="text-4xl font-black text-[#1A2F1E] tracking-tighter mb-3 italic">SMPIT Tracker</h1>
            <div class="w-12 h-1 bg-[#C9A84C] mx-auto mb-4 rounded-full"></div>
            <p class="text-[#64748b] text-sm font-bold uppercase tracking-widest">Sistem Informasi Kesiswaan<br>Laa Tahzan Citra</p>
        </div>

        <div class="space-y-8">
            <div>
                <p class="text-[10px] font-black text-[#C9A84C] uppercase tracking-[0.4em] text-center mb-6">Pilih Akses Portal</p>
                <div class="grid grid-cols-2 gap-4">
                    <button id="role-btn-guru" onclick="setLoginRole('guru')" class="sidebar-item active py-6 px-2 rounded-3xl flex flex-col items-center gap-3 border border-transparent group transition-all">
                        <span class="text-3xl group-hover:scale-125 transition-transform duration-500">🕌</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Guru / Admin</span>
                    </button>
                    <button id="role-btn-ortu" onclick="setLoginRole('orangtua')" class="sidebar-item py-6 px-2 rounded-3xl flex flex-col items-center gap-3 border border-[#f1f5f9] group transition-all text-[#64748b]">
                        <span class="text-3xl group-hover:scale-125 transition-transform duration-500">🏠</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Orang Tua</span>
                    </button>
                </div>
            </div>

            <button onclick="handleGoogleLogin()" class="w-full bg-[#1A2F1E] text-white font-black py-5 rounded-2xl flex items-center justify-center gap-4 hover:bg-[#0D4A28] transition-all shadow-2xl active:scale-95 group">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-6 h-6 p-1 bg-white rounded-full group-hover:rotate-[360deg] transition-transform duration-700" alt="Google">
                <span class="tracking-tight text-sm">Masuk dengan Google</span>
            </button>

            <div id="login-error-msg" class="hidden p-4 bg-rose-50 border border-rose-100 rounded-2xl text-rose-600 text-xs font-bold text-center"></div>
        </div>

        <div class="mt-16 text-center border-t border-[#f1f5f9] pt-8">
            <p class="text-[9px] font-black text-[#C9A84C] uppercase tracking-[0.5em]">&copy; 2026 LAA TAHZAN CITRA</p>
        </div>
    </div>
</section>
