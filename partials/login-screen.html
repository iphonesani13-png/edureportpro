<section id="login-screen" class="hidden min-h-screen flex items-center justify-center p-6 bg-[#f8fafc] relative overflow-hidden">
    <!-- Fluid Animated Background Elements -->
    <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-violet-200/40 rounded-full blur-[100px] animate-pulse"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-indigo-200/30 rounded-full blur-[100px] animate-pulse" style="animation-delay: 3s"></div>

    <div class="glass-card max-w-md w-full p-10 md:p-12 relative z-10 bg-white shadow-[0_30px_60px_-15px_rgba(124,58,237,0.15)]">
        <div class="text-center mb-12">
            <div class="w-20 h-20 bg-gradient-to-br from-violet-600 to-indigo-700 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-2xl shadow-violet-200 mx-auto mb-8 transform hover:scale-110 transition-transform duration-500">
                LT
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tighter mb-2">SMPIT <span class="text-violet-600 italic">Tracker</span></h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.2em]">Sistem Informasi Kesiswaan<br>Laa Tahzan Citra</p>
        </div>

        <div class="space-y-8">
            <div class="space-y-4">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] text-center">Pilih Akses Masuk</p>
                <div class="grid grid-cols-2 gap-4">
                    <button id="role-btn-guru" onclick="setLoginRole('guru')" class="sidebar-item active py-5 flex flex-col items-center gap-2 border border-transparent transition-all">
                        <span class="text-2xl">👨‍🏫</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Guru / Admin</span>
                    </button>
                    <button id="role-btn-ortu" onclick="setLoginRole('orangtua')" class="sidebar-item py-5 flex flex-col items-center gap-2 border border-slate-50 transition-all text-slate-400">
                        <span class="text-2xl">👪</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Orang Tua</span>
                    </button>
                </div>
            </div>

            <button onclick="handleGoogleLogin()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl flex items-center justify-center gap-4 hover:bg-black transition-all shadow-xl active:scale-95 group">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5 group-hover:rotate-12 transition-transform" alt="Google">
                <span class="text-sm tracking-tight font-bold">Lanjutkan dengan Google</span>
            </button>

            <div id="login-error-msg" class="hidden p-4 bg-rose-50 border border-rose-100 rounded-2xl text-rose-600 text-[10px] font-black uppercase text-center"></div>
        </div>

        <div class="mt-16 text-center">
            <p class="text-[9px] font-bold text-slate-300 uppercase tracking-[0.4em]">&copy; 2026 Laa Tahzan Citra</p>
        </div>
    </div>
</section>
